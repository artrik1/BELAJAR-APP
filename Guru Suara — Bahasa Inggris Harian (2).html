<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AC Tanpa Listrik - Pipa di Dalam Tanah</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; height: 100%; background: #14202b; overflow: hidden; }
  #stage {
    position: absolute; left: 50%; top: 50%;
    width: 720px; height: 1280px;
    transform-origin: center center;
    background: #5BC0EB; overflow: hidden;
    font-family: "Poppins", "Segoe UI", Arial, sans-serif;
  }
  #stage canvas { position: absolute; left: 0; top: 0; }
  .caption {
    position: absolute; left: 50%; top: 130px;
    width: 600px; box-sizing: border-box;
    background: #ffffff; border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    padding: 22px 28px; text-align: center;
    font-weight: 800; font-size: 40px; line-height: 1.3; color: #1d2b36;
    opacity: 0;
  }
  .k-green { color: #1FB5A8; }
  .k-red   { color: #E53935; }
  .k-blue  { color: #2F80ED; }
  #temp {
    position: absolute; left: 50%; bottom: 170px;
    transform: translateX(-50%);
    background: #ffffff; border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    padding: 14px 32px; font-weight: 800; font-size: 56px; color: #1d2b36;
    opacity: 0; white-space: nowrap;
  }
</style>
</head>
<body>
<div id="stage"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ================= CONFIG =================
const W = 720, H = 1280, DURATION = 60;
const Z0 = -1.5;                      // pusat z dari blok potongan tanah
const TUBULAR = 400, RADIAL = 16, PIPE_R = 0.28;

// ================= UTILITAS =================
const stage = document.getElementById('stage');
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  stage.style.transform = `translate(-50%, -50%) scale(${s})`;
}
addEventListener('resize', fit); fit();

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease  = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const lerp  = (a, b, t) => a + (b - a) * t;
const lerpArr = (a, b, t) => a.map((v, i) => lerp(v, b[i], t));
const rnd = i => { const s = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); };

// ================= RENDERER & SCENE =================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#5BC0EB');
const camera = new THREE.PerspectiveCamera(35, W / H, 0.1, 200);

scene.add(new THREE.AmbientLight(0xffffff, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 0.7);
sun.position.set(6, 14, 10);
scene.add(sun);

const mat = (color, opacity = 1, extra = {}) => new THREE.MeshStandardMaterial({
  color, roughness: 0.6, metalness: 0,
  transparent: opacity < 1, opacity, depthWrite: opacity >= 1, ...extra
});
const add = (geo, m, x = 0, y = 0, z = 0) => {
  const mesh = new THREE.Mesh(geo, m);
  mesh.position.set(x, y, z);
  scene.add(mesh);
  return mesh;
};

// ================= TANAH (potongan/cross-section) =================
add(new THREE.BoxGeometry(30, 0.6, 5.5), mat(0x7CC37A, 0.92), 0, -0.3, Z0); // rumput
add(new THREE.BoxGeometry(30, 2.6, 5.5), mat(0xC8763A, 0.55), 0, -1.9, Z0);  // tanah atas
add(new THREE.BoxGeometry(30, 3.0, 5.5), mat(0x8B5A3C, 0.55), 0, -4.7, Z0);  // tanah dalam
add(new THREE.BoxGeometry(30, 2.5, 5.5), mat(0x6F8797, 0.50), 0, -7.45, Z0); // lapisan air

// Pohon
function tree(x, z) {
  add(new THREE.CylinderGeometry(0.25, 0.3, 2, 10), mat(0x8B5A3C), x, 1, z);
  add(new THREE.SphereGeometry(1.4, 20, 16), mat(0x4E9E5B), x, 3.1, z);
}
tree(-13.5, Z0); tree(10, Z0);

// ================= RUMAH =================
const house = new THREE.Group();
house.position.set(-6, 0, Z0);
scene.add(house);
{
  const wall = new THREE.Mesh(new THREE.BoxGeometry(4.2, 3, 4), mat(0xF5F5F0));
  wall.position.y = 1.5; house.add(wall);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(3.4, 1.8, 4), mat(0xF07A3D));
  roof.rotation.y = Math.PI / 4; roof.position.y = 3.9; house.add(roof);
  const door = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.6, 0.1), mat(0x1FB5A8));
  door.position.set(0, 0.8, 2.05); house.add(door);
}

// ================= RUANGAN KECIL (tujuan pendinginan) =================
const room = new THREE.Group();
room.position.set(3, 0, Z0);
scene.add(room);
{
  const wallMat = mat(0xFFFFFF);
  const addLocal = (g, m, x, y, z) => { const mm = new THREE.Mesh(g, m); mm.position.set(x, y, z); room.add(mm); return mm; };
  addLocal(new THREE.BoxGeometry(3.2, 0.2, 3.2), wallMat, 0, 0.1, 0);    // lantai
  addLocal(new THREE.BoxGeometry(3.2, 2.4, 0.2), wallMat, 0, 1.3, -1.5); // dinding belakang
  addLocal(new THREE.BoxGeometry(0.2, 2.4, 3.2), wallMat, -1.5, 1.3, 0); // dinding kiri
  addLocal(new THREE.BoxGeometry(0.2, 2.4, 3.2), wallMat, 1.5, 1.3, 0);  // dinding kanan
  addLocal(new THREE.BoxGeometry(3.4, 0.2, 3.4), mat(0xF07A3D), 0, 2.6, 0); // atap
  // sofa
  addLocal(new THREE.BoxGeometry(1.6, 0.6, 0.7), mat(0x1FB5A8), -0.3, 0.5, -1.0);
  addLocal(new THREE.BoxGeometry(1.6, 0.9, 0.25), mat(0x1FB5A8), -0.3, 0.95, -1.3);
  // termometer
  addLocal(new THREE.CylinderGeometry(0.08, 0.08, 2.2, 10), mat(0xFFFFFF), 0.9, 1.4, -1.35);
  addLocal(new THREE.SphereGeometry(0.16, 12, 10), mat(0xE53935), 0.9, 0.35, -1.35);
}
var mercury = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1, 8), mat(0xE53935));
mercury.geometry.translate(0, 0.5, 0);          // pangkal di bawah
mercury.position.set(3 + 0.9, 0.45, Z0 - 1.35 + 0.0);
scene.add(mercury);

// ================= PIPA BAWAH TANAH =================
const pipeCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-10.5, 1.3, Z0),   // lubang masuk di atas tanah
  new THREE.Vector3(-10.5, -0.4, Z0),
  new THREE.Vector3(-9.5, -2.2, Z0),
  new THREE.Vector3(2.2, -2.2, Z0),    // horizontal di bawah tanah
  new THREE.Vector3(3, -2.2, Z0),
  new THREE.Vector3(3, -1.2, Z0),
  new THREE.Vector3(3, 0.1, Z0)        // naik masuk ke ruangan
], false, 'centripetal');

const pipeGeo = new THREE.TubeGeometry(pipeCurve, TUBULAR, PIPE_R, RADIAL, false);
const pipe = new THREE.Mesh(pipeGeo, new THREE.MeshStandardMaterial({
  color: 0xCFE3EE, roughness: 0.35, metalness: 0.1, side: THREE.DoubleSide
}));
scene.add(pipe);

// Genangan air di dasar pipa horizontal
const pool = new THREE.Mesh(
  new THREE.CylinderGeometry(0.18, 0.18, 9.6, 20),
  mat(0x4DA3FF, 0.85)
);
pool.rotation.z = Math.PI / 2;
pool.position.set(-3.2, -2.27, Z0);
pool.visible = false;
scene.add(pool);

// Partikel aliran udara di dalam pipa (oranye -> biru)
const cOrange = new THREE.Color(0xF07A3D);
const cBlue   = new THREE.Color(0x4DA3FF);
const flow = [];
for (let i = 0; i < 36; i++) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 8), mat(0xF07A3D));
  m.scale.setScalar(0.0001);
  scene.add(m);
  flow.push({ m, off: i / 36 });
}

// Panah udara
function makeArrow(color) {
  const g = new THREE.Group();
  const cone = new THREE.Mesh(new THREE.ConeGeometry(0.38, 0.8, 16), mat(color));
  cone.rotation.z = Math.PI;           // ujung menghadap ke bawah
  g.add(cone);
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.9, 12), mat(color));
  shaft.position.y = 0.85;
  g.add(shaft);
  scene.add(g);
  return { g, cone, shaft };
}
const orangeArrow = makeArrow(0xF07A3D);
orangeArrow.g.position.set(-10.5, 2.5, Z0);
const blueArrow = makeArrow(0xF07A3D);
blueArrow.g.position.set(3, 3.4, Z0);

// ================= ADEGAN 1: partikel galian tanah =================
const dirt = [];
for (let i = 0; i < 40; i++) {
  const m = add(new THREE.BoxGeometry(0.16, 0.16, 0.16), mat(0x8B5A3C), 0, -10, 0);
  m.visible = false;
  dirt.push({ m, i });
}

// ================= ADEGAN 3: udara panas tertahan =================
const hot = [];
for (let i = 0; i < 50; i++) {
  const m = add(new THREE.SphereGeometry(0.09, 8, 6), mat(0xF07A3D), 0, 0, 0);
  m.scale.setScalar(0.0001);
  hot.push({
    m, s: i,
    x: -8 + rnd(i) * 10,
    y: 0.6 + rnd(i + 100) * 1.2,
    z: 1.2 + rnd(i + 200) * 1.4
  });
}

// Tanda silang merah
const redX = new THREE.Group();
redX.position.set(-2.5, 2.7, 1.5);
redX.scale.setScalar(0.0001);
scene.add(redX);
{
  const xm = mat(0xE53935);
  const b1 = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.22, 0.22), xm);
  b1.rotation.z = Math.PI / 4;
  const b2 = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.22, 0.22), xm);
  b2.rotation.z = -Math.PI / 4;
  redX.add(b1, b2);
}

// ================= ADEGAN 4: tetesan air di dalam pipa =================
const drops = [];
const DROP_N = 140;
for (let i = 0; i < DROP_N; i++) {
  const m = add(new THREE.SphereGeometry(0.05, 8, 6), mat(0x4DA3FF), 0, -10, 0);
  m.visible = false;
  drops.push({
    m,
    ts: 38.5 + (i / DROP_N) * 9,        // waktu munculnya tetesan
    x: -6.5 + rnd(i) * 9,
    a: rnd(i + 500) * Math.PI           // posisi di dinding atas pipa
  });
}

// ================= ADEGAN 5: partikel udara sejuk di ruangan =================
const cool = [];
for (let i = 0; i < 30; i++) {
  const m = add(new THREE.SphereGeometry(0.07, 8, 6), mat(0x4DA3FF), 0, 0, 0);
  m.scale.setScalar(0.0001);
  cool.push({ m, i });
}

// ================= KAMERA (keyframe) =================
const orbit = a => [Math.sin(a) * 17, 5.5, Z0 + Math.cos(a) * 17];
const KEYS = [
  { t: 0,  p: orbit(-0.45), l: [0, -1.2, Z0] },     // orbit perlahan
  { t: 10, p: orbit(0.25),  l: [0, -1.2, Z0] },
  { t: 12, p: [0, 2.5, 13.5], l: [0, -1.5, Z0] },   // pandangan samping
  { t: 22, p: [-1.5, 3, 13], l: [-1, -1.5, Z0] },
  { t: 38, p: [0, 4, 12],    l: [-2, -1, Z0] },
  { t: 42, p: [0.6, -2.2, Z0], l: [-6, -2.2, Z0] }, // masuk ke dalam pipa
  { t: 49, p: [0.6, -2.2, Z0], l: [-6, -2.2, Z0] },
  { t: 54, p: [0, 6, 16],    l: [0, -0.5, Z0] },    // kembali ke rumah
  { t: 60, p: [0, 6, 16],    l: [0, -0.5, Z0] }
];
function camAt(t) {
  for (let i = 0; i < KEYS.length - 1; i++) {
    const a = KEYS[i], b = KEYS[i + 1];
    if (t <= b.t) {
      const e = ease((t - a.t) / (b.t - a.t));
      return { p: lerpArr(a.p, b.p, e), l: lerpArr(a.l, b.l, e) };
    }
  }
  const last = KEYS[KEYS.length - 1];
  return { p: last.p, l: last.l };
}

// ================= TEKS KETERANGAN =================
const CAPS = [
  { s: 0.4,  e: 9.6,  html: 'Kalau kamu gali lubang di halaman' },
  { s: 10.4, e: 21.6, html: 'Jadi <span class="k-green">pipanya</span> ditanam lebih dalam' },
  { s: 22.4, e: 37.6, html: '<span class="k-red">Tapi</span> udara panas tertahan di atas tanah' },
  { s: 38.4, e: 49.6, html: 'Udaranya <span class="k-blue">mengembun</span> di dalam pipa' },
  { s: 50.4, e: 59.6, html: 'Hasilnya nggak sedingin AC, tapi <span class="k-green">lumayan sejuk</span> tanpa listrik' }
];
const capEls = CAPS.map(c => {
  const el = document.createElement('div');
  el.className = 'caption';
  el.innerHTML = c.html;
  stage.appendChild(el);
  return el;
});

const tempEl = document.createElement('div');
tempEl.id = 'temp';
stage.appendChild(tempEl);

// ================= RENDER PER WAKTU =================
function renderAt(t) {
  // Teks keterangan: fade-in dari bawah, fade-out di akhir
  CAPS.forEach((c, i) => {
    const fi = ease((t - c.s) / 0.5);
    const fo = ease((c.e - t) / 0.4);
    capEls[i].style.opacity = Math.min(fi, fo);
    capEls[i].style.transform = `translate(-50%, ${(1 - fi) * 40}px)`;
  });

  // Kamera
  const cam = camAt(t);
  camera.position.set(cam.p[0], cam.p[1], cam.p[2]);
  camera.lookAt(cam.l[0], cam.l[1], cam.l[2]);

  // Adegan 1: partikel galian (0–10 detik)
  dirt.forEach(({ m, i }) => {
    const dt = t - (0.6 + i * 0.12);
    if (t < 10 && dt > 0 && dt < 1.6) {
      const vx = (rnd(i) - 0.5) * 2.2;
      const vy = 3.2 + rnd(i + 3) * 2.2;
      const x = -1.2 + rnd(i + 1) * 2.4 + vx * dt;
      const y = 0.2 + vy * dt - 0.5 * 9 * dt * dt;
      m.position.set(x, y, Z0 + (rnd(i + 2) - 0.5) * 2);
      m.rotation.set(dt * 4 + i, dt * 3, 0);
      m.visible = y > -0.3;
    } else {
      m.visible = false;
    }
  });

  // Adegan 2: pipa tumbuh dari lubang masuk (10–18 detik)
  const reveal = ease((t - 10) / 8);
  pipeGeo.setDrawRange(0, Math.floor(TUBULAR * reveal) * RADIAL * 6);

  // Panah oranye (udara masuk) muncul 13–15 detik, lalu melayang
  const oS = ease((t - 13) / 2);
  orangeArrow.g.scale.setScalar(oS + 0.0001);
  orangeArrow.g.position.y = 2.5 + Math.sin(t * 3) * 0.1;

  // Panah biru (udara keluar) muncul 15–17 detik, warnanya berubah bertahap
  const bS = ease((t - 15) / 2) * (1 - ease((t - 38) / 1));
  blueArrow.g.scale.setScalar(bS + 0.0001);
  blueArrow.g.position.y = 3.4 + Math.sin(t * 3 + 1) * 0.1;
  const bc = new THREE.Color(0xF07A3D).lerp(cBlue, ease((t - 16) / 6));
  blueArrow.cone.material.color.copy(bc);
  blueArrow.shaft.material.color.copy(bc);

  // Partikel aliran: oranye di pintu masuk, berubah biru di pintu keluar
  const flowS = ease((t - 14) / 2) * (1 - ease((t - 38) / 1));
  flow.forEach(f => {
    const u = (t * 0.08 + f.off) % 1;
    const p = pipeCurve.getPointAt(u);
    f.m.position.copy(p);
    f.m.scale.setScalar(flowS + 0.0001);
    f.m.material.color.copy(cOrange).lerp(cBlue, u);
  });

  // Adegan 3: udara panas tertahan + tanda silang (22–38 detik)
  const hotF = ease((t - 22) / 2) * (1 - ease((t - 36) / 2));
  hot.forEach(h => {
    h.m.position.set(
      h.x + Math.sin(t * 1.3 + h.s) * 0.5,
      h.y + Math.sin(t * 1.7 + h.s * 2) * 0.2,
      h.z
    );
    h.m.scale.setScalar(hotF + 0.0001);
  });
  const xF = ease((t - 24) / 2) * (1 - ease((t - 37) / 1));
  redX.scale.setScalar(xF + 0.0001);

  // Adegan 4: tetesan air dari dinding pipa, jatuh karena gravitasi (38–50 detik)
  drops.forEach(d => {
    const dt = t - d.ts;
    if (dt < 0 || t > 50) { d.m.visible = false; return; }
    d.m.visible = true;
    const y0 = -2.2 + 0.2 * Math.sin(d.a);
    const z0 = Z0 + 0.2 * Math.cos(d.a);
    const floor = -2.35;
    const y = Math.max(floor, y0 - 0.5 * 9 * dt * dt);
    const landed = y <= floor;
    d.m.position.set(d.x, y, landed ? Z0 + (rnd(d.x * 7) - 0.5) * 0.2 : z0);
  });
  pool.visible = t > 42;
  pool.material.opacity = 0.85 * ease((t - 42) / 3);

  // Adegan 5: ruangan sejuk + termometer turun 34°C -> 29°C (50–60 detik)
  const tf = ease((t - 50.5) / 6);
  const temp = lerp(34, 29, tf);
  mercury.scale.y = Math.max(0.001, (temp - 18) * 0.12);
  tempEl.textContent = Math.round(temp) + '°C';
  tempEl.style.opacity = ease((t - 50) / 0.8) * (1 - ease((t - 59) / 0.8));

  cool.forEach(({ m, i }) => {
    const cS = ease((t - 50) / 2) * (1 - ease((t - 58) / 1));
    m.position.set(
      3 + (rnd(i) - 0.5) * 2.4,
      0.6 + ((rnd(i + 7) + t * 0.25) % 1) * 1.6,
      Z0 + (rnd(i + 9) - 0.5) * 2.2
    );
    m.scale.setScalar(cS + 0.0001);
  });

  renderer.render(scene, camera);
}

// ================= LOOP / MODE FRAME =================
// ?t=detik  -> render satu frame pada waktu itu (untuk ekspor)
// tanpa parameter -> putar real-time dan loop setiap 60 detik
const params = new URLSearchParams(location.search);
const fixedT = params.has('t') ? parseFloat(params.get('t')) : null;
window.renderAt = renderAt;

const startTime = performance.now();
function loop() {
  const t = fixedT !== null ? fixedT : ((performance.now() - startTime) / 1000) % DURATION;
  renderAt(t);
  if (fixedT === null) requestAnimationFrame(loop);
}
loop();
</script>
</body>
  </html>
