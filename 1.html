<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guru Suara — Bahasa Inggris Harian</title>
<style>
:root{--bg:#f3f6f2;--card:#ffffff;--ink:#1c2b24;--mute:#5d6d65;--acc:#1f6f5b;--acc2:#e4efe9;--warn:#b4532a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a16;--card:#18251f;--ink:#e8f1ec;--mute:#9bb0a5;--acc:#5cc6a6;--acc2:#1f3329;--warn:#f0a57c}}
:root[data-theme="dark"]{--bg:#101a16;--card:#18251f;--ink:#e8f1ec;--mute:#9bb0a5;--acc:#5cc6a6;--acc2:#1f3329;--warn:#f0a57c}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;line-height:1.5;min-height:100%}
main{max-width:520px;margin:0 auto;padding:20px 18px 40px;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;align-items:baseline}
h1{font-size:1.25rem;margin:0}
.streak{color:var(--mute);font-size:.9rem}
.card{background:var(--card);border-radius:20px;padding:26px 22px;min-height:230px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.en{font-family:Georgia,"Times New Roman",serif;font-size:1.9rem;line-height:1.25;margin:0}
.id{color:var(--mute);margin:0;font-size:1.05rem}
.status{display:flex;align-items:center;gap:10px;min-height:28px;font-weight:600}
.dot{width:12px;height:12px;border-radius:50%;background:var(--mute);flex:none}
.speaking .dot{background:var(--acc);animation:p 1s infinite}
.listening .dot{background:var(--warn);animation:p .7s infinite}
@keyframes p{50%{transform:scale(1.5);opacity:.5}}
@media (prefers-reduced-motion:reduce){.dot{animation:none!important}}
.heard{color:var(--mute);font-size:.95rem;min-height:1.4em}
.prog{display:flex;gap:6px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--acc2)}
.prog i.on{background:var(--acc)}
button{font:inherit;font-weight:700;border:0;border-radius:16px;padding:16px;cursor:pointer;background:var(--acc);color:#fff;font-size:1.1rem}
button.alt{background:var(--acc2);color:var(--ink)}
button:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.row{display:flex;gap:10px}.row button{flex:1}
small{color:var(--mute)}
.xp{display:flex;align-items:center;gap:10px;font-size:.9rem;font-weight:600}
.bar{flex:1;height:10px;border-radius:5px;background:var(--acc2);overflow:hidden}
.bar b{display:block;height:100%;background:var(--acc);width:0;transition:width .4s}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badges span{padding:6px 12px;border-radius:999px;font-size:.85rem;background:var(--acc2);color:var(--mute);opacity:.6}
.badges span.on{background:var(--acc);color:#fff;opacity:1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;z-index:9;text-align:center}
#scn{display:flex;flex-direction:column;gap:10px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <header><h1>Guru Suara</h1><span class="streak" id="streak"></span></header>
  <div class="xp"><span id="lvl"></span><div class="bar"><b id="xpb"></b></div><span id="xpt"></span></div>
  <div class="row"><button id="t1">Pelajaran</button><button class="alt" id="t2">Simulasi</button></div>
  <div class="prog" id="prog"></div>
  <section class="card" aria-live="polite">
    <p class="en" id="en">Siap belajar hari ini?</p>
    <p class="id" id="id">Tekan Mulai. Guru akan berbicara, lalu Anda menjawab dengan suara.</p>
  </section>
  <div class="status" id="status"><span class="dot"></span><span id="stx">Menunggu</span></div>
  <div class="heard" id="heard"></div>
  <button id="go">Mulai pelajaran hari ini</button>
  <div class="row" id="ctl" hidden>
    <button class="alt" id="skip">Lewati</button>
    <button class="alt" id="stop">Berhenti</button>
  </div>
  <button class="alt" id="next" hidden>Saya sudah mengucapkan, lanjut</button>
  <button id="retry" hidden>Ucapkan sekarang</button>
  <div id="scn" hidden></div>
  <div class="badges" id="badges"></div>
  <div id="toast" hidden></div>
  <small id="note">Tip: pakai earphone agar mikrofon tidak menangkap suara guru.</small>
</main>
<script>
const LESSONS=[
["Good morning. How are you?","Selamat pagi. Apa kabar?"],
["Nice to meet you.","Senang bertemu dengan Anda."],
["Could you help me, please?","Bisakah Anda membantu saya?"],
["I would like a cup of coffee.","Saya mau secangkir kopi."],
["Where is the nearest station?","Di mana stasiun terdekat?"],
["How much does this cost?","Berapa harganya ini?"],
["I don't understand. Could you repeat that?","Saya tidak mengerti. Bisa diulang?"],
["What time does the meeting start?","Jam berapa rapat dimulai?"],
["I am learning English every day.","Saya belajar bahasa Inggris setiap hari."],
["Let me think about it.","Biar saya pikirkan dulu."],
["Thank you for your help.","Terima kasih atas bantuan Anda."],
["I'm sorry, I'm late.","Maaf, saya terlambat."],
["Can I pay by card?","Bisakah saya bayar dengan kartu?"],
["What do you do for work?","Apa pekerjaan Anda?"],
["I usually wake up at six.","Saya biasanya bangun jam enam."],
["It's a pleasure to work with you.","Senang bekerja sama dengan Anda."],
["Could you speak more slowly?","Bisakah Anda bicara lebih pelan?"],
["I'm looking for a good restaurant.","Saya mencari restoran yang bagus."],
["Have a nice weekend.","Selamat berakhir pekan."],
["See you tomorrow.","Sampai jumpa besok."]
];
const $=id=>document.getElementById(id);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const synth=window.speechSynthesis;
let run=0,rec=null,skipFlag=false,waitRes=null;

const key=d=>d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
const today=new Date();
const dayNum=Math.floor(new Date(today.getFullYear(),today.getMonth(),today.getDate())/864e5);
const todays=[0,1,2,3,4].map(i=>LESSONS[(dayNum*5+i)%LESSONS.length]);

function load(){try{return JSON.parse(localStorage.getItem("guru-inggris"))||{}}catch(e){return{}}}
function save(o){try{localStorage.setItem("guru-inggris",JSON.stringify(o))}catch(e){}}
function showStreak(){const s=load();$("streak").textContent=s.streak?`Beruntun ${s.streak} hari, ${s.phrases||0} kalimat`:"Belum ada rekor";}
function finishDay(){
  const s=load(),t=key(today),y=new Date(today);y.setDate(y.getDate()-1);
  if(s.last!==t){s.streak=(s.last===key(y))?(s.streak||0)+1:1;s.last=t;s.phrases=(s.phrases||0)+5;save(s);addXP(20,"pelajaran harian selesai");}
  showStreak();
}
showStreak();
const BADGES=[["Langkah pertama","xp",1],["100 XP","xp",100],["Beruntun 3 hari","streak",3],["25 kalimat","phrases",25],["Aktor simulasi","sims",1]];
function toast(t){const e=$("toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{e.hidden=true},2500)}
function gamify(){const s=load(),x=s.xp||0;$("lvl").textContent="Level "+(Math.floor(x/100)+1);$("xpb").style.width=(x%100)+"%";$("xpt").textContent=x+" XP";$("badges").innerHTML=BADGES.map(b=>`<span class="${(s.b||[]).includes(b[0])?"on":""}">${b[0]}</span>`).join("")}
function checkBadges(){const s=load();s.b=s.b||[];BADGES.forEach(([n,k,v])=>{if(!s.b.includes(n)&&(s[k]||0)>=v){s.b.push(n);toast("Lencana baru: "+n)}});save(s);gamify()}
function addXP(n,why){const s=load(),a=Math.floor((s.xp||0)/100);s.xp=(s.xp||0)+n;save(s);toast("+"+n+" XP, "+why);if(Math.floor(s.xp/100)>a)setTimeout(()=>toast("Naik ke Level "+(a+2)+"!"),1800);checkBadges()}
gamify();
function prog(){const s=load();return s.day===dayNum?(s.idx||0):0}
function setIdx(i){const s=load();s.day=dayNum;s.idx=i;save(s)}
function label(){const i=prog();return i>=todays.length?"Ulangi pelajaran hari ini":i>0?`Lanjutkan dari kalimat ${i+1}`:"Mulai pelajaran hari ini"}
$("prog").innerHTML=todays.map((_,j)=>`<i class="${j<prog()?"on":""}"></i>`).join("");
$("go").textContent=label();
if(prog()>0&&prog()<todays.length)$("id").textContent=`Progres tersimpan: ${prog()} dari ${todays.length} kalimat selesai.`;
if(!SR)$("note").textContent="Peramban ini tidak mendukung pengenalan suara. Guru tetap berbicara; tekan tombol lanjut setelah Anda mengucapkan. Untuk pengalaman penuh, gunakan Chrome atau Safari.";
if(!synth){$("note").textContent="Peramban ini tidak mendukung suara. Gunakan Chrome, Edge, atau Safari.";$("go").disabled=true;}

function pick(lang){
  const v=synth.getVoices(),pre=lang.slice(0,2);
  return v.find(x=>x.lang.replace("_","-")===lang)||v.find(x=>x.lang.toLowerCase().startsWith(pre))||null;
}
function say(text,lang,rate){
  return new Promise(res=>{
    if(skipFlag)return res();
    const u=new SpeechSynthesisUtterance(text);
    u.lang=lang;u.rate=rate||1;const v=pick(lang);if(v)u.voice=v;
    u.onend=u.onerror=()=>res();
    synth.speak(u);
  });
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);g.gain.value=.15;o.frequency.value=880;o.start();setTimeout(()=>{o.stop();c.close()},180)}catch(e){}}
let micErr=null;
async function listen(){
  if(!SR)return new Promise(res=>{waitRes=res;$("next").hidden=false});
  micErr=null;
  while(synth.speaking)await sleep(100);
  await sleep(800);beep();await sleep(300);
  return new Promise(res=>{
    let done=false;const fin=t=>{if(!done){done=true;res(t)}};
    rec=new SR();rec.lang="en-US";rec.interimResults=false;
    rec.onresult=e=>fin(e.results[0][0].transcript);
    rec.onerror=e=>{micErr=e.error;fin(null)};rec.onend=()=>fin(null);
    try{rec.start()}catch(e){fin(null)}
    setTimeout(()=>{try{rec.stop()}catch(e){}},9000);
  });
}
function listenOld(){
  return new Promise(res=>{
    if(!SR){waitRes=res;$("next").hidden=false;return;}
    let done=false;const fin=t=>{if(!done){done=true;res(t)}};
    rec=new SR();rec.lang="en-US";rec.interimResults=false;
    rec.onresult=e=>fin(e.results[0][0].transcript);
    rec.onerror=()=>fin(null);rec.onend=()=>fin(null);
    try{rec.start()}catch(e){fin(null)}
    setTimeout(()=>{try{rec.stop()}catch(e){}},9000);
  });
}
const words=s=>s.toLowerCase().replace(/[^a-z' ]/g,"").split(/\s+/).filter(Boolean);
function score(t,h){const a=words(t),b=new Set(words(h));return a.filter(w=>b.has(w)).length/a.length;}
function state(cls,txt){$("status").className="status "+cls;$("stx").textContent=txt;}

async function lesson(){
  const my=++run;skipFlag=false;const start=prog()>=todays.length?0:prog();if(start===0)setIdx(0);
  const live=()=>my===run;
  $("go").hidden=true;$("ctl").hidden=false;
  synth.cancel();
  state("speaking","Guru berbicara");
  await say(start>0?`Selamat datang kembali! Kita lanjutkan dari kalimat ${start+1}.`:"Halo! Selamat datang. Hari ini kita belajar lima kalimat. Dengarkan, lalu ucapkan kembali dengan suara.","id-ID",1);
  for(let i=start;i<todays.length&&live();i++){
    const [en,id]=todays[i];skipFlag=false;
    $("en").textContent=en;$("id").textContent=id;$("heard").textContent="";
    document.querySelectorAll("#prog i").forEach((e,j)=>e.classList.toggle("on",j<=i));
    state("speaking","Dengarkan");
    await say(`Kalimat ${i+1}.`,"id-ID",1);if(!live())return;
    await say(en,"en-US",.85);if(!live())return;
    await say("Artinya: "+id,"id-ID",1);if(!live())return;
    for(let t=0;t<3&&live()&&!skipFlag;t++){
      await say(t?"Coba sekali lagi.":"Sekarang giliran Anda.","id-ID",1);if(!live())return;
      if(t){state("speaking","Dengarkan lagi");await say(en,"en-US",.75);if(!live())return;}
      state("listening","Giliran Anda: ucapkan");
      const h=await listen();if(!live()||skipFlag)break;
      $("next").hidden=true;
      if(h===null&&SR){
        if(micErr==="not-allowed"||micErr==="service-not-allowed"){$("heard").textContent="Mikrofon belum diizinkan. Izinkan di pengaturan peramban.";state("","Mikrofon diblokir");await say("Mikrofon belum diizinkan. Izinkan mikrofon di pengaturan peramban, lalu mulai lagi.","id-ID",1);$("stop").click();return;}
        $("heard").textContent="Suara belum terdengar.";state("","Menunggu Anda");
        await say("Saya belum mendengar suara Anda. Tekan tombol Ucapkan sekarang, lalu bicara.","id-ID",1);if(!live())return;
        await new Promise(r=>{waitRes=r;$("retry").hidden=false});$("retry").hidden=true;
        if(!live()||skipFlag)break;
        t--;continue;
      }
      if(h)$("heard").textContent="Terdengar: "+h;
      const s=h?score(en,h):1;
      state("speaking","Guru berbicara");
      if(s>=.7){addXP(t===0?10:6,"ucapan benar");await say("Bagus sekali!","id-ID",1);break;}
      else if(t<2){await say("Hampir benar.","id-ID",1);}
      else{await say("Tidak apa-apa. Kita lanjut, nanti kita ulang lagi.","id-ID",1);}
    }
    if(live())setIdx(i+1);
  }
  if(!live())return;
  finishDay();
  $("en").textContent="Pelajaran selesai!";$("id").textContent="Sampai jumpa besok.";
  $("ctl").hidden=true;$("go").hidden=false;$("go").textContent="Ulangi pelajaran";
  state("speaking","Guru berbicara");
  await say("Pelajaran hari ini selesai. Kerja bagus! Sampai jumpa besok.","id-ID",1);
  state("","Selesai");
}
function halt(){run++;$("retry").hidden=true;try{rec&&rec.abort()}catch(e){}synth.cancel();if(waitRes){waitRes(null);waitRes=null}$("next").hidden=true;}
$("go").onclick=()=>{halt();if(synth.getVoices().length===0)synth.getVoices();lesson();};
$("stop").onclick=()=>{halt();state("","Dihentikan");$("ctl").hidden=true;home();};
$("skip").onclick=()=>{skipFlag=true;try{rec&&rec.abort()}catch(e){}synth.cancel();if(waitRes){waitRes(null);waitRes=null}};
$("next").onclick=()=>{$("next").hidden=true;if(waitRes){const r=waitRes;waitRes=null;r("")}};
$("retry").onclick=()=>{if(waitRes){const r=waitRes;waitRes=null;r("")}};
if(synth)synth.onvoiceschanged=()=>{};

const SIMS={
"Di kafe":{npc:"barista",turns:[
["Hi there! Welcome. What can I get for you?","I would like a cup of coffee, please.","Saya mau secangkir kopi."],
["Sure. Would you like it hot or iced?","Hot, please.","Panas, tolong."],
["Anything else?","No, that's all. How much is it?","Tidak, itu saja. Berapa harganya?"],
["That's four dollars.","Can I pay by card?","Bisakah saya bayar dengan kartu?"]]},
"Di bandara":{npc:"petugas check-in",turns:[
["Good morning. May I see your passport?","Here you go. I am going to London.","Ini dia. Saya akan ke London."],
["Do you have any bags to check in?","Yes, I have one suitcase.","Ya, saya punya satu koper."],
["Would you prefer a window or an aisle seat?","A window seat, please.","Kursi dekat jendela, tolong."],
["Here is your boarding pass. Gate twelve.","Thank you. Where is gate twelve?","Terima kasih. Di mana gerbang dua belas?"]]}
};
let mode="lesson";
function home(){const m=mode==="sim";$("scn").hidden=!m;$("go").hidden=m;if(!m)$("go").textContent=label()}
function setMode(m){halt();$("ctl").hidden=true;mode=m;$("t1").className=m==="lesson"?"":"alt";$("t2").className=m==="sim"?"":"alt";state("","Menunggu");$("heard").textContent="";
  if(m==="sim"){$("en").textContent="Simulasi percakapan";$("id").textContent="Pilih situasi. Anda berbicara langsung dengan tokoh dalam bahasa Inggris.";$("prog").innerHTML=""}
  else{$("en").textContent="Siap belajar hari ini?";$("id").textContent="Tekan Mulai. Guru akan berbicara, lalu Anda menjawab dengan suara.";$("prog").innerHTML=todays.map((_,j)=>`<i class="${j<prog()?"on":""}"></i>`).join("")}
  home()}
$("t1").onclick=()=>setMode("lesson");$("t2").onclick=()=>setMode("sim");
$("scn").innerHTML=Object.keys(SIMS).map(k=>`<button class="alt" data-k="${k}">${k}</button>`).join("");
$("scn").onclick=e=>{const k=e.target.dataset.k;if(k)sim(k)};

async function turn(target,live){
  for(let t=0;t<3;t++){
    state("listening","Giliran Anda: jawab");
    const h=await listen();if(!live())return"stop";if(skipFlag)return"skip";
    $("next").hidden=true;
    if(h===null&&SR){
      if(micErr==="not-allowed"||micErr==="service-not-allowed"){$("heard").textContent="Mikrofon belum diizinkan. Izinkan di pengaturan peramban.";await say("Mikrofon belum diizinkan.","id-ID",1);$("stop").click();return"stop";}
      $("heard").textContent="Suara belum terdengar.";state("","Menunggu Anda");
      await say("Saya belum mendengar suara Anda. Tekan tombol, lalu bicara.","id-ID",1);if(!live())return"stop";
      await new Promise(r=>{waitRes=r;$("retry").hidden=false});$("retry").hidden=true;
      if(!live())return"stop";if(skipFlag)return"skip";
      t--;continue;
    }
    if(h)$("heard").textContent="Terdengar: "+h;
    if(score(target,h||target)>=.6)return"ok";
    state("speaking","Guru berbicara");
    await say(t<2?"Hampir. Ucapkan seperti ini:":"Tidak apa-apa. Contohnya:","id-ID",1);if(!live())return"stop";
    await say(target,"en-US",.8);if(!live())return"stop";
  }
  return"miss";
}
async function sim(name){
  const my=++run;skipFlag=false;const live=()=>my===run,S=SIMS[name];
  synth.cancel();$("scn").hidden=true;$("ctl").hidden=false;
  $("prog").innerHTML=S.turns.map(()=>"<i></i>").join("");
  state("speaking","Guru berbicara");
  await say(`Simulasi ${name}. Saya berperan sebagai ${S.npc}. Anda menjawab dalam bahasa Inggris.`,"id-ID",1);
  for(let i=0;i<S.turns.length&&live();i++){
    const [npc,me,id]=S.turns[i];skipFlag=false;
    document.querySelectorAll("#prog i").forEach((e,j)=>e.classList.toggle("on",j<=i));
    $("en").textContent=npc;$("id").textContent=`Saran jawaban: "${me}" (${id})`;$("heard").textContent="";
    state("speaking","Lawan bicara berbicara");
    await say(npc,"en-US",.95);if(!live())return;
    await say("Giliran Anda.","id-ID",1);if(!live())return;
    const r=await turn(me,live);if(!live()||r==="stop")return;
    if(r==="ok")addXP(15,"jawaban benar");
  }
  if(!live())return;
  const s=load();s.sims=(s.sims||0)+1;save(s);addXP(30,"simulasi selesai");
  $("en").textContent="Simulasi selesai!";$("id").textContent="Anda berhasil menyelesaikan percakapan.";
  $("ctl").hidden=true;home();state("speaking","Guru berbicara");
  await say("Thank you, have a nice day!","en-US",.95);
  await say("Simulasi selesai. Kerja bagus!","id-ID",1);state("","Selesai");
}
</script>
</body>
</html>
